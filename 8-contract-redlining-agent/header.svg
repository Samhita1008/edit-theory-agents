<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Agent 8: Contract Redlining"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C151E"/><stop offset="1" stop-color="#34090f"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#F5DABF" fill-opacity=".09"/></pattern>
<clipPath id="panelclip"><polygon points="840,0 1200,0 1200,170 768,170"/></clipPath><style>
.k{font-family:'SF Mono',Menlo,Consolas,monospace;fill:#F5DABF;opacity:.75;letter-spacing:4px}
.t{font-family:Georgia,'Times New Roman',serif;fill:#F5DABF;font-weight:700}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#d4b49b}
.rise{animation:r 1s cubic-bezier(.2,.7,.2,1) both}
