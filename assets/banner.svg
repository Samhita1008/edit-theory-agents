<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Edit Theory Agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050807"/><stop offset="1" stop-color="#0b1511"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5CF2B0"/><stop offset="1" stop-color="#2FD08A"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#14231c" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5CF2B0"/></marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.7"/>

  <text x="60" y="92" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="4" fill="#5CF2B0">EDIT THEORY</text>
  <text x="60" y="162" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="#F2F7F4">n8n agents,</text>
  <text x="60" y="226" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="url(#mint)">with the receipts.</text>
  <text x="60" y="266" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8FA89C">Pipelines, stacks, and the exact bugs hit while building each one.</text>

  <!-- pipeline motif -->
  <g transform="translate(790,100)" fill="none" stroke="#5CF2B0" stroke-width="2.5" stroke-linejoin="round">
    <rect x="0" y="30" width="70" height="50" rx="10"/>
    <rect x="130" y="30" width="70" height="50" rx="10" fill="#5CF2B0" fill-opacity="0.12"/>
    <rect x="260" y="30" width="70" height="50" rx="10"/>
    <path d="M70 55H128M200 55H258" marker-end="url(#a)"/>
    <path d="M165 30V0H35V28" stroke-opacity="0.35" stroke-dasharray="5 5"/>
  </g>
</svg>
